<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="420" height="860">
  <defs>
    <linearGradient id="vpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2387"/>
      <stop offset="50%" stop-color="#E94057"/>
      <stop offset="100%" stop-color="#F27121"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998E"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E1306C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Device Frame & OLED Pure Black Canvas -->
  <rect x="0" y="0" width="420" height="860" rx="36" fill="#000000" stroke="#2A2A2A" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="32" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">9:41</text>
  <circle cx="355" cy="27" r="4" fill="#FFFFFF"/>
  <rect x="365" y="23" width="12" height="8" rx="2" fill="#FFFFFF"/>
  <rect x="382" y="21" width="20" height="11" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="384" y="23" width="14" height="7" rx="1.5" fill="#10B981"/>

  <!-- Top App Bar -->
  <g id="appBar">
    <rect x="0" y="44" width="420" height="64" fill="#121212"/>
    <text x="24" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Chats</text>

    <!-- Theme Indicator Badge -->
    <rect x="100" y="69" width="84" height="22" rx="11" fill="#1A1A1A" stroke="#2A2A2A"/>
    <circle cx="112" cy="80" r="5" fill="url(#vpGrad)"/>
    <text x="123" y="84" fill="#A0A0A0" font-family="sans-serif" font-size="10" font-weight="600">OLED Dark</text>

    <!-- Search & New Chat Icons -->
    <circle cx="340" cy="76" r="18" fill="#1A1A1A"/>
    <path d="M336 72 A4 4 0 1 1 342 78 M341 77 L346 82" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- User Avatar / Profile Button -->
    <circle cx="384" cy="76" r="18" fill="url(#vpGrad)"/>
    <text x="384" y="81" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">AF</text>
    <circle cx="398" cy="88" r="4.5" fill="#10B981" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- In-App Update Notice Pill -->
  <g id="updateNotice">
    <rect x="20" y="120" width="380" height="44" rx="12" fill="#121212" stroke="#2A2A2A" stroke-width="1.2"/>
    <circle cx="42" cy="142" r="12" fill="url(#vpGrad)"/>
    <path d="M42 136 L42 146 M38 142 L42 146 L46 142" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="138" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Messenger v1.0.0 Release</text>
    <text x="64" y="152" fill="#A0A0A0" font-family="sans-serif" font-size="10">P2P 1 GB Engine • Google Sign-In • Zero Cost</text>
    <rect x="330" y="131" width="56" height="22" rx="11" fill="#10B981"/>
    <text x="358" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Chat Item 1: Sarah Connor (Unread, Active Now) -->
  <g id="chat1" transform="translate(0, 180)">
    <rect x="12" y="0" width="396" height="84" rx="16" fill="#121212" stroke="#2A2A2A" stroke-width="1" filter="url(#cardGlow)"/>
    <!-- Avatar with Online Dot -->
    <circle cx="52" cy="42" r="24" fill="url(#blueGrad)"/>
    <text x="52" y="47" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">SC</text>
    <circle cx="68" cy="58" r="6" fill="#10B981" stroke="#121212" stroke-width="2"/>

    <!-- Contact Details -->
    <text x="88" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Sarah Connor</text>
    <text x="88" y="54" fill="#E1306C" font-family="sans-serif" font-size="13" font-weight="500">⚡ 1 GB WebRTC transfer complete!</text>

    <!-- Timestamp & Unread Badge -->
    <text x="388" y="32" fill="#E1306C" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">10:42 AM</text>
    <rect x="368" y="42" width="20" height="20" rx="10" fill="#E1306C"/>
    <text x="378" y="56" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
  </g>

  <!-- Chat Item 2: Elena Rostova (View Once Media) -->
  <g id="chat2" transform="translate(0, 276)">
    <rect x="12" y="0" width="396" height="84" rx="16" fill="#121212" stroke="#1E1E1E"/>
    <!-- Avatar -->
    <circle cx="52" cy="42" r="24" fill="url(#vpGrad)"/>
    <text x="52" y="47" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">ER</text>

    <!-- Contact Details -->
    <text x="88" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Elena Rostova</text>
    <!-- View-once icon & pill -->
    <rect x="88" y="42" width="138" height="20" rx="10" fill="#1A1A1A" stroke="#2A2A2A"/>
    <circle cx="100" cy="52" r="4" fill="none" stroke="#E1306C" stroke-width="1.5"/>
    <circle cx="100" cy="52" r="1.5" fill="#E1306C"/>
    <text x="110" y="56" fill="#A0A0A0" font-family="sans-serif" font-size="11" font-weight="500">1 Photo • View Once</text>

    <!-- Timestamp -->
    <text x="388" y="32" fill="#666666" font-family="sans-serif" font-size="11" text-anchor="end">Yesterday</text>
    <!-- Double Checkmark (Read) -->
    <text x="388" y="56" fill="#0084FF" font-family="sans-serif" font-size="12" text-anchor="end">✓✓</text>
  </g>

  <!-- Chat Item 3: Core Engineering (Group Chat) -->
  <g id="chat3" transform="translate(0, 372)">
    <rect x="12" y="0" width="396" height="84" rx="16" fill="#121212" stroke="#1E1E1E"/>
    <!-- Group Avatar -->
    <circle cx="52" cy="42" r="24" fill="url(#emeraldGrad)"/>
    <text x="52" y="47" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">DEV</text>

    <!-- Contact Details -->
    <text x="88" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Monorepo Engineering</text>
    <text x="88" y="54" fill="#A0A0A0" font-family="sans-serif" font-size="13">Marcus: LiveKit SFU calls tested 100%</text>

    <!-- Timestamp -->
    <text x="388" y="32" fill="#666666" font-family="sans-serif" font-size="11" text-anchor="end">Wed</text>
    <text x="388" y="56" fill="#666666" font-family="sans-serif" font-size="12" text-anchor="end">✓✓</text>
  </g>

  <!-- Chat Item 4: Alex Novak -->
  <g id="chat4" transform="translate(0, 468)">
    <rect x="12" y="0" width="396" height="84" rx="16" fill="#121212" stroke="#1E1E1E"/>
    <circle cx="52" cy="42" r="24" fill="#242424"/>
    <text x="52" y="47" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">AN</text>
    <text x="88" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Alex Novak</text>
    <text x="88" y="54" fill="#A0A0A0" font-family="sans-serif" font-size="13">See you on the video call at 4 PM</text>
    <text x="388" y="32" fill="#666666" font-family="sans-serif" font-size="11" text-anchor="end">Nov 12</text>
  </g>

  <!-- Chat Item 5: Maya Lin -->
  <g id="chat5" transform="translate(0, 564)">
    <rect x="12" y="0" width="396" height="84" rx="16" fill="#121212" stroke="#1E1E1E"/>
    <circle cx="52" cy="42" r="24" fill="#2E2E2E"/>
    <text x="52" y="47" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">ML</text>
    <text x="88" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Maya Lin</text>
    <text x="88" y="54" fill="#A0A0A0" font-family="sans-serif" font-size="13">Sticker pack "Cyber Noir" uploaded</text>
    <text x="388" y="32" fill="#666666" font-family="sans-serif" font-size="11" text-anchor="end">Nov 10</text>
  </g>

  <!-- Floating Action Button (New Chat) -->
  <g id="fab" transform="translate(332, 690)">
    <circle cx="32" cy="32" r="28" fill="url(#vpGrad)" filter="url(#cardGlow)"/>
    <path d="M32 20 L32 44 M20 32 L44 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="navBar" transform="translate(0, 780)">
    <rect x="0" y="0" width="420" height="80" fill="#121212" stroke="#2A2A2A" stroke-width="1"/>
    
    <!-- Tab 1: Chats (Active) -->
    <g transform="translate(70, 20)">
      <circle cx="0" cy="10" r="14" fill="#E1306C" fill-opacity="0.2"/>
      <path d="M-8 6 C-8 1 -3 -2 2 -2 C7 -2 12 1 12 6 C12 11 8 13 4 13 L-1 15 L0 12 C-6 12 -8 9 -8 6 Z" fill="#E1306C"/>
      <text x="0" y="32" fill="#E1306C" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Chats</text>
    </g>

    <!-- Tab 2: Calls -->
    <g transform="translate(210, 20)">
      <path d="M-6 4 C-6 11 1 17 8 17 L10 14 C10 13 9 12 8 12 L5 11 C4 11 3 11 3 12 L1 14 C-2 12 -4 10 -6 7 L-4 5 C-3 5 -3 4 -3 3 L-4 0 C-4 -1 -5 -2 -6 -2 L-8 0 C-9 2 -8 5 -6 4 Z" fill="#666666"/>
      <text x="0" y="32" fill="#666666" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Calls</text>
    </g>

    <!-- Tab 3: Profile -->
    <g transform="translate(350, 20)">
      <circle cx="0" cy="6" r="6" fill="#666666"/>
      <path d="M-9 18 C-9 13 -4 12 0 12 C4 12 9 13 9 18" fill="none" stroke="#666666" stroke-width="2"/>
      <text x="0" y="32" fill="#666666" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Profile</text>
    </g>
  </g>
</svg>
