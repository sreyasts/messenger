project_id = "private-messenger"

[api]
enabled = true
port = 54321
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[functions.livekit-token]
verify_jwt = false
